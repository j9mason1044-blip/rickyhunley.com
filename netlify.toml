# The site is plain static files at the repo root — nothing to build.
[build]
  publish = "."
  command = ""

# Netlify serves /about for /about.html on its own; nothing to configure.

# The publish directory is the repo root, so everything in the repo is a URL
# unless it is blocked here. The generator, its copy of the design source and
# the developer README have no business being served from the live domain.
# `force` is required: without it Netlify serves the real file and ignores the
# rule, because a redirect does not shadow an existing file by default.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/studio/*"
  to = "/404.html"
  status = 404
  force = true

# Old Squarespace URLs. rickyhunley.com ran on Squarespace until this site
# replaced it, and none of its paths match. Without these, every existing link,
# bookmark and indexed result 404s on the day of the cutover.
#
# Taken from the Squarespace sitemap. /gallery has no equivalent here and goes
# to the home page; /privacypolicy and /terms are deliberately absent — see the
# README, they need real pages rather than a redirect to somewhere wrong.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/1984"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/speaking"
  to = "/speaking.html"
  status = 301

[[redirects]]
  from = "/hunley-huddle"
  to = "/huddle.html"
  status = 301

[[redirects]]
  from = "/press"
  to = "/news.html"
  status = 301

[[redirects]]
  from = "/eventsblog"
  to = "/news.html"
  status = 301

[[redirects]]
  from = "/eventsblog/*"
  to = "/news.html"
  status = 301

# The blog is hidden for now, so its own URL and the Squarespace ones that used
# to point at it all go to the home page. /blog.html is listed because the page
# was briefly live before being hidden.
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/personal-blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/personal-blog/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
