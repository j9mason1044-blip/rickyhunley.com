# The site is plain static files at the repo root — nothing to build.
[build]
  publish = "."
  command = ""

# Netlify serves /about for /about.html on its own; nothing to configure.

# The publish directory is the repo root, so everything in the repo is a URL
# unless it is blocked here. The generator, its copy of the design source and
# the developer README have no business being served from the live domain.
# `force` is required: without it Netlify serves the real file and ignores the
# rule, because a redirect does not shadow an existing file by default.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/studio/*"
  to = "/404.html"
  status = 404
  force = true

# Old Squarespace URLs. rickyhunley.com ran on Squarespace until this site
# replaced it, and none of its paths match. Without these, every existing link,
# bookmark and indexed result 404s on the day of the cutover.
#
# Taken from the Squarespace sitemap. /gallery has no equivalent here and goes
# to the home page; /privacypolicy and /terms are deliberately absent — see the
# README, they need real pages rather than a redirect to somewhere wrong.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/1984"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/speaking"
  to = "/speaking.html"
  status = 301

[[redirects]]
  from = "/hunley-huddle"
  to = "/huddle.html"
  status = 301

[[redirects]]
  from = "/press"
  to = "/news.html"
  status = 301

[[redirects]]
  from = "/eventsblog"
  to = "/news.html"
  status = 301

[[redirects]]
  from = "/eventsblog/*"
  to = "/news.html"
  status = 301

# The blog is hidden for now, so its own URL and the Squarespace ones that used
# to point at it all go to the home page. /blog.html is listed because the page
# was briefly live before being hidden.
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/personal-blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/personal-blog/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache lifetimes are short because none of these filenames carry a content
# hash. css/site.css and js/site.js are regenerated by every design update, and
# assets/ changes whenever a photograph is replaced — so a long max-age means
# returning visitors keep stale files with no way to be told otherwise. That is
# not hypothetical: the hover states shipped broken, and a week-long max-age on
# the stylesheet would have kept them broken for everyone who had already
# visited.
#
# must-revalidate leans on Netlify's ETags, so an unchanged file still costs
# only a 304. If this ever needs to be faster, the fix is content-hashed
# filenames (build-static.js already rewrites asset references, so it could
# stamp hashes too) — then, and only then, a year of `immutable` is correct.

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The one exception: 4.3 MB, and it changes far more rarely than the images.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
