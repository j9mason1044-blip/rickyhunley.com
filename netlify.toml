# The blog comes from Sanity; every other page is generated from the design.
# fetch-content.js writes tools/content.json, build-static.js renders it — the
# same two commands you would run locally, so a deploy cannot drift from a
# local build.
#
# build-assets.js is deliberately absent: it needs ffmpeg and the Dropbox
# masters, neither of which exist here, and assets/ is committed.
[build]
  publish = "."
  command = "node tools/fetch-content.js && node tools/build-static.js"

[build.environment]
  # fetch-content.js uses global fetch, so anything below Node 18 fails at the
  # first query. Pinned rather than left to Netlify's default, which has moved
  # before and would take the blog down when it moves again.
  NODE_VERSION = "22"

# Netlify serves /about for /about.html on its own; nothing to configure.

# The publish directory is the repo root, so everything in the repo is a URL
# unless it is blocked here. The generator, its copy of the design source and
# the developer README have no business being served from the live domain.
# `force` is required: without it Netlify serves the real file and ignores the
# rule, because a redirect does not shadow an existing file by default.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/studio/*"
  to = "/404.html"
  status = 404
  force = true

# Old Squarespace URLs. rickyhunley.com ran on Squarespace until this site
# replaced it, and none of its paths match. Without these, every existing link,
# bookmark and indexed result 404s on the day of the cutover.
#
# Taken from the Squarespace sitemap. /gallery has no equivalent here and goes
# to the home page; /privacypolicy and /terms are deliberately absent — see the
# README, they need real pages rather than a redirect to somewhere wrong.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/1984"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/speaking"
  to = "/speaking.html"
  status = 301

[[redirects]]
  from = "/hunley-huddle"
  to = "/huddle.html"
  status = 301

[[redirects]]
  from = "/press"
  to = "/news.html"
  status = 301

[[redirects]]
  from = "/eventsblog"
  to = "/news.html"
  status = 301

[[redirects]]
  from = "/eventsblog/*"
  to = "/news.html"
  status = 301

# The blog is live now, so its URLs point at it rather than at the home page.
#
# /blog needs stating explicitly. Netlify serves /about for /about.html without
# being asked, but that only works while nothing else claims the path — and
# /blog is now also a directory, holding the twelve article pages. Netlify looks
# for blog/index.html, finds none, and would 404 without this. `from = "/blog"`
# matches that one path exactly, so the articles under /blog/ are untouched.
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/personal-blog"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/personal-blog/*"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# css/ and js/ carry a content hash in the filename (site.<hash>.css), written
# by build-static.js. New content means a new URL, so a cached copy can never be
# stale — which is what makes a year of `immutable` correct here rather than
# reckless.
#
# This matters more than it sounds. The stylesheet once went out under a single
# fixed URL with a week-long max-age, and browsers that fetched it in that
# window kept serving it for days afterwards — rendering the site without its
# mobile layout, with no request made and nothing the server could say about it.
# Hashed names are the only reliable fix for that.

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The one exception: 4.3 MB, and it changes far more rarely than the images.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
